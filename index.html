<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VEIL</title>
    <meta name="description" content="VEIL — parkour místico em 3D no navegador. Corra, surfe, balance no gancho e atravesse o Véu em 27 fases para costurar o que você rasgou." />
    <meta property="og:title" content="VEIL" />
    <meta property="og:description" content="Parkour místico em 3D no navegador: 27 fases, surf, gancho, dois mundos e um Colosso." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#05070c" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305070c'/%3E%3Cpath d='M16 4 L22 16 L16 28 L10 16 Z' fill='%236fb8ff'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; background: #04060c; overflow: hidden; }
      #boot {
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at center, #0b1430 0%, #04060c 70%); color: #d6e2ff;
        font-family: 'Cinzel', 'Trajan Pro', 'Palatino Linotype', 'Book Antiqua', Georgia, serif; transition: opacity 0.8s;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot h1 { margin: 0; font-weight: 400; font-size: 64px; letter-spacing: 0.45em; margin-right: -0.45em; text-shadow: 0 0 30px rgba(90, 160, 255, 0.85); }
      #boot .rune { width: 34px; height: 34px; margin: 28px 0 14px; animation: spin 2.4s linear infinite; }
      #boot p { font-size: 13px; letter-spacing: 0.3em; text-transform: uppercase; color: #8796b8; margin: 0; }
      #boot .err { display: none; max-width: 520px; text-align: center; letter-spacing: 0.05em; text-transform: none; font-size: 15px; line-height: 1.6; color: #ffb0bd; margin-top: 18px; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot">
      <h1>VEIL</h1>
      <svg class="rune" viewBox="0 0 32 32"><path d="M16 2 L24 16 L16 30 L8 16 Z M16 9 L20 16 L16 23 L12 16 Z" fill="#6fb8ff" fill-rule="evenodd" /></svg>
      <p id="boot-msg">tecendo o mundo…</p>
      <p class="err" id="boot-err"></p>
    </div>
    <noscript><p style="color:#fff;text-align:center;margin-top:40vh">VEIL precisa de JavaScript ativado.</p></noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
